name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js-tests:
    name: JS test suite (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # .npmrc 的 ignore-scripts=true 会跳过 better-sqlite3 的预编译二进制下载，
      # 显式 rebuild 这一个经过审计的包（其余依赖仍不执行任何安装脚本）
      - run: npm rebuild better-sqlite3
      - run: node --test test/*.test.js test/agents/*.test.js

  python-syntax:
    name: Python syntax check (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 纯语法编译检查，不 import、不装依赖——研究脚本的依赖（torch 等）不在 CI 装
      - run: python -m compileall -q lib cli scripts/koc kronos
