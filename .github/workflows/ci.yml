name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js-tests:
    name: JS test suite (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 标准测试套件不依赖任何原生模块（test/import-guard.test.js 锁定该不变量），
      # 因此 .npmrc 的 ignore-scripts=true 下无需构建 better-sqlite3
      - run: node --test test/*.test.js test/agents/*.test.js

  python-syntax:
    name: Python syntax check (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 纯语法编译检查，不 import、不装依赖——研究脚本的依赖（torch 等）不在 CI 装
      - run: python -m compileall -q lib cli scripts/koc kronos
